<!doctype html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>{{ page.title }}</title>
  <meta name='description' content='{{ page.description }}'>
  <meta property='og:title' content='{{ page.og_title | default: page.title }}'>
  <meta property='og:description' content='{{ page.og_description | default: page.description }}'>
  <meta property='og:type' content='website'>
  <link rel='icon' href='{{ "/assets/img/favicon-placeholder.png" | relative_url }}'>
  <link rel='stylesheet' href='{{ "/assets/css/styles.css" | relative_url }}'>
</head>
<body>
<a href='#main' class='skip-link'>Skip to content</a>
{% include header.html %}
<main id='main'>
{{ content }}
</main>
{% include footer.html %}
<script src='{{ "/assets/js/site.js" | relative_url }}'></script>
</body>
</html>
